version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=cctv_monitoring
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      - db
      - redis
    volumes:
      - .:/var/www/html
      - storage:/var/www/html/storage
      - bootstrap/cache:/var/www/html/bootstrap/cache
    command: sh -c "php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=cctv_monitoring
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - QUEUE_CONNECTION=database
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      - app
      - db
      - redis
    volumes:
      - .:/var/www/html
      - storage:/var/www/html/storage
      - bootstrap/cache:/var/www/html/bootstrap/cache
    command: php artisan queue:work database --sleep=3 --tries=3 --max-time=3600

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=cctv_monitoring
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - app
      - db
    volumes:
      - .:/var/www/html
      - storage:/var/www/html/storage
      - bootstrap/cache:/var/www/html/bootstrap/cache
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=cctv_monitoring
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www/html
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storage:
  bootstrap_cache:
