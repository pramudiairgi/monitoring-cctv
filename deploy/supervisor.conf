[program:monitoring-queue]
process_name=%(program_name)s_%(process_num)02d
command=php __APP_DIR__/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=2
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/queue.log
stopwaitsecs=3600

[program:laravel-schedule]
process_name=%(program_name)s_%(process_num)02d
command=php __APP_DIR__/artisan schedule:work
autostart=true
autorestart=true
user=www
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/schedule.log
